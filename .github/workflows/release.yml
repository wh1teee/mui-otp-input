name: Release OTP prerelease

on:
  push:
    tags:
      - v8.0.0-next.*

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish exact prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 12.4.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.18.1
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm ci:pr
      - id: candidate
        run: |
          candidate_dir="$RUNNER_TEMP/mui-otp-input-release"
          node scripts/create-release-candidate.mjs \
            --output-dir="$candidate_dir" \
            --require-tag
          version="$(node -p "require('./package.json').version")"
          tarball="$candidate_dir/wh1teee-mui-otp-input-$version.tgz"
          test -f "$tarball"
          echo "directory=$candidate_dir" >> "$GITHUB_OUTPUT"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: >-
          node scripts/verify-release-artifact.mjs
          --artifact="${{ steps.candidate.outputs.tarball }}"
      - run: >-
          node scripts/verify-packed-consumers.mjs
          --artifact="${{ steps.candidate.outputs.tarball }}"
      - run: npm install --global npm@11.16.0
      - name: Create draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          directory="${{ steps.candidate.outputs.directory }}"
          title="@wh1teee/mui-otp-input ${{ steps.candidate.outputs.version }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$directory"/* --clobber
            gh release edit "$tag" \
              --prerelease \
              --title "$title" \
              --notes-file "$directory/RELEASE_NOTES.md"
          else
            gh release create "$tag" "$directory"/* \
              --draft \
              --prerelease \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes-file "$directory/RELEASE_NOTES.md"
          fi
      - name: Publish exact tarball through npm OIDC
        env:
          NPM_CONFIG_PROVENANCE: 'true'
        run: |
          specifier="@wh1teee/mui-otp-input@${{ steps.candidate.outputs.version }}"
          if npm view "$specifier" version >/dev/null 2>&1; then
            echo "$specifier is already present; registry parity verification remains mandatory."
          else
            npm publish "${{ steps.candidate.outputs.tarball }}" \
              --access public \
              --tag next \
              --provenance
          fi
      - run: >-
          node scripts/verify-registry-release.mjs
          --directory="${{ steps.candidate.outputs.directory }}"
      - name: Publish registry evidence and prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          directory="${{ steps.candidate.outputs.directory }}"
          gh release upload "$tag" \
            "$directory/registry.json" \
            "$directory/registry-tarball-sha256.txt" \
            "$directory/provenance-audit.json" \
            --clobber
          gh release edit "$tag" --draft=false --prerelease
