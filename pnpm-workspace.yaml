packages:
  - 'site'

allowBuilds:
  core-js: true
  core-js-pure: true
  esbuild: true

packageExtensions:
  # Published declarations import packages they do not declare. Explicit edges
  # keep strict site type-checking (skipLibCheck: false) working in the
  # isolated global virtual store.
  'next@>=16.3.5 <17':
    dependencies:
      '@types/react': ^19.3.0
      '@types/react-dom': ^19.3.0
  'react-hook-form@>=7.83.0 <8':
    dependencies:
      '@types/react': ^19.3.0
  '@mui/material@>=9.4.0 <10':
    dependencies:
      '@mui/styled-engine': ^9.4.0
  '@mui/styled-engine@>=9.4.0 <10':
    dependencies:
      '@types/react': ^19.3.0
  '@emotion/utils@>=1.4.2 <2':
    dependencies:
      '@emotion/sheet': ^1.4.0
